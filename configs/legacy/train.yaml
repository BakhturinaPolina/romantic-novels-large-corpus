# LEGACY (v2 fit paths): superseded by configs/stage03/train_v3.yaml + paths_stage03_fit_v3.yaml
# Stage03 train/eval BERTopic tuning configuration

# Tune on the pre-built stratified fit/eval samples (see paths_stage03_fit.yaml).
# Build them once with: python -m src.stage03_train.make_fit_sample ...
paths_config: "configs/legacy/paths_stage03_fit.yaml"

embedding_models:
  - "sentence-transformers/all-MiniLM-L12-v2"
  - "sentence-transformers/paraphrase-mpnet-base-v2"
  - "sentence-transformers/paraphrase-MiniLM-L6-v2"

device: "auto"
embedding_batch_size: 256

# Reuse precomputed FULL-corpus train_eval embeddings (skip re-encoding). One .npy
# per model, all aligned to the same full train->eval corpus order. Paths follow the
# run-id convention data/interim/octis/<run_id>/embeddings_cache/train_eval_<safe_name>.npy.
# Adjust the run-id folders to match where each laptop's cache was written.
embeddings_cache:
  overrides:
    "sentence-transformers/all-MiniLM-L12-v2": "data/interim/octis/minilm12v2_first/embeddings_cache/train_eval_sentence-transformers__all-MiniLM-L12-v2.npy"
    "sentence-transformers/paraphrase-mpnet-base-v2": "data/interim/octis/mpnet_first/embeddings_cache/train_eval_sentence-transformers__paraphrase-mpnet-base-v2.npy"
    "sentence-transformers/paraphrase-MiniLM-L6-v2": "data/interim/octis/minilm6_first/embeddings_cache/train_eval_sentence-transformers__paraphrase-MiniLM-L6-v2.npy"

# Optional Hub cache for large embedding .npy files (private dataset).
# Authenticate with: export HF_TOKEN="hf_..."  (never commit tokens to git)
embeddings_hub:
  enabled: true
  repo_id: "RuthonField/romance-v2-train-eval-embeddings"
  # Upload local .npy + manifest after encoding completes.
  upload_after_compute: false
  # Download from Hub when local .npy is missing (skips re-encoding).
  download_if_missing: true

text:
  sentence_column: "sentence"
  # Stream CSV rows in batches (avoids loading full train/val into RAM).
  csv_chunk_size: 50000
  # Coherence eval uses stratified val indices (eval_indices_file). This cap only
  # bounds the fallback sequential loader when no eval indices are configured.
  coherence_eval_max_docs: 100000
  # Upper bound on fit docs. The stratified fit_indices file already targets 500k
  # train-only rows; this clips it if larger and bounds the random fallback.
  bertopic_fit_max_docs: 500000

# BERTopic runtime flags applied to every trial and the final retrain.
bertopic:
  # Skip full document-by-topic probability matrices: too expensive at 500k docs
  # and unnecessary for OCTIS coherence/diversity selection. Outlier rate is read
  # from hard topic labels (-1) instead. Stage 05 can re-enable for a probability run.
  calculate_probabilities: false

optimization:
  number_of_calls: 130
  model_runs: 3
  save_models: false
  seed: 42
  default_stability_score: 0.0
  topic_stability:
    enabled: true
    max_n_topics_std: 3.0
    collapse_ratio: 0.5
    penalty_weight: 0.2
  # Penalize BO objective when n_topics < min_n_topics (linear shortfall).
  # Align min_n_topics with configs/stage04/eval_select.yaml. Tune weight after ~20 BO
  # calls on _v2: raise if all n_topics < 20, lower if coherence drops badly.
  topic_count_penalty:
    enabled: true
    min_n_topics: 20
    weight: 0.15

# Search space shifted/expanded from the 100-novel billionaire-romance pretest.
# The pretest optimum is kept inside each range. Clustering-size bounds were
# initially raised for the 500k-sentence fit corpus, but the first stratified run
# (seed42) collapsed to 2-3 topics every trial, so min_cluster_size/min_topic_size
# were narrowed back down and min_samples capped at 50 to allow finer clustering
# (target 20-100+ topics). See
# results/reports/stage03/stage03_bertopic_search_space_prior.md for the justification.
search_space:
  umap__n_neighbors: [10, 75]
  umap__n_components: [5, 15]
  umap__min_dist: [0.02, 0.15]
  hdbscan__min_cluster_size: [50, 800]
  hdbscan__min_samples: [5, 50]
  vectorizer__min_df: [0.002, 0.015]
  bertopic__top_n_words: [20, 50]
  bertopic__min_topic_size: [50, 500]
