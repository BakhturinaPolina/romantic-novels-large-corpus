# v4 granular L12 pilot — 10 BO calls before full 160-call Phase 1 run.
# Same search space as train_v4_l12_granular_phase1.yaml; resume to 160 by
# switching config number_of_calls after pilot review.

paths_config: "configs/stage03/paths_stage03_fit_v3.yaml"

embedding_models:
  - "sentence-transformers/all-MiniLM-L12-v2"

device: "auto"
embedding_batch_size: 256

embeddings_cache:
  overrides:
    "sentence-transformers/all-MiniLM-L12-v2": "data/interim/octis/v3_english_only/embeddings_cache/train_eval_sentence-transformers__all-MiniLM-L12-v2.npy"

embeddings_hub:
  enabled: true
  repo_id: "RuthonField/romance-v2-train-eval-embeddings"
  upload_after_compute: false
  download_if_missing: true

text:
  sentence_column: "sentence"
  csv_chunk_size: 50000
  coherence_eval_max_docs: 100000
  bertopic_fit_max_docs: 500000

bertopic:
  calculate_probabilities: false

optimization:
  number_of_calls: 10
  model_runs: 1
  save_models: false
  seed: 42
  default_stability_score: 0.0
  topic_stability:
    enabled: false
    max_n_topics_std: 75.0
    collapse_ratio: 0.5
    penalty_weight: 0.2
  topic_count_penalty:
    enabled: true
    min_n_topics: 50
    weight: 0.30

search_space:
  umap__n_neighbors: [5, 45]
  umap__n_components: [5, 20]
  umap__min_dist: [0.0, 0.12]
  hdbscan__min_cluster_size: [25, 350]
  hdbscan__min_samples: [5, 45]
  hdbscan__cluster_selection_method: ["eom", "leaf"]
  vectorizer__min_df: [3, 25]
  bertopic__top_n_words: [20, 50]
