# Stage04 eval-select — exploratory L6 (v3_minilm6_first)
#
# Use when the production gates in eval_select.yaml leave too few L6 trials
# (7/130 with model_runs=3). These settings widen the pool for notebook /
# manual review; do NOT use for final Stage05 winner without extra scrutiny.
#
# L6 funnel on current trials_partial.csv (130 calls):
#   production (eval_select.yaml)     →  7 trials
#   moderate (this file, default)    → 17 trials — drops unstable high-std fits
#   wide (profile below)               → 42 trials — min_topics only
#
# Run:
#   .venv/bin/python -m src.stage04_eval_select.cli select \
#     --trials results/experiments/v3_minilm6_first/opt_1_sentence-transformers__paraphrase-MiniLM-L6-v2/trials_partial.csv \
#     --config configs/legacy/eval_select_exploratory_l6.yaml \
#     --run-id v3_minilm6_first
#
# Notebook: point eval_select_config in selection_notebooks.yaml here, or load
# eval_cfg from this path in the pareto notebook setup cell.

selection:
  pareto_first: true
  top_k: 10

  # --- Moderate exploratory (recommended) ---
  # Keeps n_topics >= 20; skips topic_stability_pass (BO already penalized
  # unstable calls during search); caps n_topics_std for post-hoc sanity.
  min_n_topics: 20
  require_topic_stability: false
  max_n_topics_std: 15.0

  # --- Wide exploratory (uncomment to use) ---
  # Largest pool; includes seed-sensitive hyperparams (e.g. call 73 std≈16).
  # min_n_topics: 20
  # require_topic_stability: false
  # max_n_topics_std: 0

  # --- Balanced (uncomment to use) ---
  # Slightly looser stability than production; still requires topic_stability_pass.
  # min_n_topics: 15
  # require_topic_stability: true
  # max_n_topics_std: 5.0

weights:
  # Favor coherence on the wider Pareto set — at 0.5/0.35 call_88 (376 topics)
  # still wins; 0.7/0.15 picks call_11 (~38 topics, best BO objective).
  coherence: 0.7
  diversity: 0.15
  outlier: 0.1
  stability: 0.05
