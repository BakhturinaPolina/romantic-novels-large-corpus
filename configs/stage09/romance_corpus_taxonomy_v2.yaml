# Romance Corpus Topic Taxonomy v2.4
# Stage 09: full leaf taxonomy for zero-shot classification (context + axis labels).
# Stage 10: only axis_bearing_ids contribute to hypothesis macro-axes.
#
# ID migration from v2.2:
#   8.3  -> 8.3b (default: everyday props) or 8.3a (commitment symbols only)
#   5.3  -> 5.3b (default: gossip/parties) or 5.3a (wedding/proposal/ceremony)
# ID migration from v2.3:
#   6.1  -> 6.1b (default: generic business/deal) or 6.1a (elite romantic status/power)
#
# Main design principles:
# 1. Separate axis-bearing thematic labels from context/style/subgenre flags.
# 2. Avoid double-counting the same topic by object, place, emotion, and relationship function.
# 3. Use priority rules when multiple labels seem possible.
# 4. Do not use generic procedural_transition or generic subgenre_marker categories.
# 5. Use uncertain_interpretable instead of forcing weak topics into 4.2.

version: "2.4"

# Narrow allowlist for Stage10 hypothesis macro-axis construction (H1–H6).
