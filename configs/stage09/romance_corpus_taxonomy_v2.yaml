  - "6.4"
  - "6.6"
  - "6.7"
  - "7.2"
  - "7.3"
  - "7.4"
  - "8.3a"

exclude_from_axes_ids:
  - noise
  - uncertain_interpretable
  - "1.1"
  - "1.2"
  - "1.5"
  - "1.6"
  - "1.7"
  - "4.1"
  - "5.1"
  - "5.2"
  - "5.3b"
  - "6.1b"
  - "6.2"
  - "6.3"
  - "6.5"
  - "7.1"
  - "8.1"
  - "8.2"
  - "8.3b"
  - "8.4"
  - "8.5"
  - "9.1"
  - "9.2"
