# ============================================================
# FROZEN MEASUREMENT SCHEMA — v2.4 (multi-genre corpus)
# ============================================================
# Taxonomy: configs/stage09/romance_corpus_taxonomy_v2.yaml (version 2.4)
# axis_bearing_ids in taxonomy YAML defines Stage10 macro-axis eligibility.
# Book-level aggregation: src/stage10_correlation_analysis/data_preparation/02_book_aggregation.py

global:
  normalization: zscore_global
  radway_weighting: conditional
  min_anchor_components: 2
  reliability_thresholds:
    cronbach_alpha: 0.60
    mcdonald_omega: 0.65
  sign_stability_threshold: 0.90
  taxonomy_config: configs/stage09/romance_corpus_taxonomy_v2.yaml
  exclude_from_axes_ids:
    - noise
    - uncertain_interpretable
    - "1.1"
    - "1.2"
    - "1.5"
    - "1.6"
    - "1.7"
    - "4.1"
    - "5.1"
    - "5.2"
    - "5.3b"
    - "6.1b"
    - "6.2"
    - "6.3"
    - "6.5"
    - "7.1"
    - "8.1"
    - "8.2"
    - "8.3b"
    - "8.4"
    - "8.5"
    - "9.1"
    - "9.2"
    - "9.3"
    - "9.4"
    - "10.1"
    - "10.2"
    - "10.3"
    - "10.4"
  aggregation:
    respect_exclude_from_axes: true
    min_topic_mass_docs: null
  schema_code_aliases:
    AX_payoff_safety: payoff_safety
    AX_love_over_sex: love_over_sex
    AX_hea_index: hea_index
    AX_explicitness: explicitness_ratio
    AX_dark_vs_tender: dark_vs_tender
    AX_miscommunication: miscommunication
    AX_miscommunication_balance: miscommunication_balance
    AX_protective_care: protective_care
    AX_possessiveness: possessiveness
    AX_protective_vs_possessive: protective_vs_possessive
    AX_status_power: status_power
    AX_luxury_composite: luxury_composite
    AX_luxury_x_love: luxury_x_love
    AX_appearance_presentation: appearance_presentation
    AX_violence_coercion: violence_coercion
    AX_external_crisis: external_crisis
    AX_everyday_intimacy_emotional_safety: everyday_intimacy_emotional_safety
    AX_sexual_tension_explicit_intimacy: sexual_tension_explicit_intimacy
    AX_coercion_risk_watchlist: coercion_risk_watchlist
    AX_economic_dependency: economic_precarity_dependency
    AX_attraction: attraction
    AX_internal_ambivalence: internal_ambivalence

# ------------------------------------------------------------
# PAYOFF / SAFETY (CONFIRMATORY, CORE) — H2 partial, H3 factor
# ------------------------------------------------------------
AX_payoff_safety:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H2, H3]
  description: >
    Secure relational payoff: reconciliation, commitment, positive emotional resolution.
    3.1 counts only when mapping shows resolution/relief/payoff — not generic amusement.

  anchors:
    taxonomy:
      - 4.5
      - 3.1

  radway_weights:
    I: 0.0
    II: 0.5
    III: 1.0

  construction:
    method: weighted_sum
    weights: equal

# ------------------------------------------------------------
# LOVE OVER SEX (CONFIRMATORY) — H1
# ------------------------------------------------------------
AX_love_over_sex:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H1]
  description: >
    Emotional commitment and care minus explicit sexual content.
    Difference form preferred when 2.3 mass is sparse.

  construction:
    method: difference
    minuend:
      ref: AX_payoff_safety
    subtrahend:
      taxonomy:
        - 2.3

  radway_weights:
    I: 0.2
    II: 0.7
    III: 1.0

# ------------------------------------------------------------
# HEA INDEX (CONFIRMATORY) — H2
# ------------------------------------------------------------
AX_hea_index:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H2]
  description: >
    Happily-ever-after signals: commitment, romantic social rituals (5.3a), commitment-symbol objects (8.3a).

  anchors:
    taxonomy:
      - 4.5
      - 5.3a
      - 8.3a

  construction:
    method: weighted_sum
    weights:
      "4.5": 1.0
      "5.3a": 0.8
      "8.3a": 0.5

# ------------------------------------------------------------
# EXPLICITNESS (CONFIRMATORY / Stage 11 reach-quality split)
# ------------------------------------------------------------
AX_explicitness:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H1]
  description: >
    Explicit sexual content (quality-negative in pilot; reach-positive in some models).

  anchors:
    taxonomy:
      - 2.3

  construction:
    method: weighted_sum
    weights: equal

  derived:
    explicitness_ratio:
      method: ratio
      numerator_ref: AX_explicitness
      denominator_refs: [AX_payoff_safety, AX_explicitness]

# ------------------------------------------------------------
# ATTRACTION / CHEMISTRY (EXPLORATORY)
# ------------------------------------------------------------
AX_attraction:
  type: evaluative
  hypothesis_role: exploratory
  description: >
    Non-explicit romantic chemistry and desire cues. Excludes 1.6, 1.7, 9.x.

  anchors:
    taxonomy:
      - 2.1

  excludes:
    taxonomy:
      - 1.6
      - 1.7

  radway_weights:
    I: 0.7
    II: 1.0
    III: 0.6

  construction:
    method: weighted_sum
    weights: equal

# ------------------------------------------------------------
# APPEARANCE & SELF-PRESENTATION (EXPLORATORY)
# ------------------------------------------------------------
AX_appearance_presentation:
  type: evaluative
  hypothesis_role: exploratory
  description: >
    Hair, grooming, clothes, nonsexual gaze and expression — distinct from 2.1 and 2.3.

  composite_ref: appearance_presentation

  construction:
    method: weighted_sum_from_composite

# ------------------------------------------------------------
# BASELINE NEGATIVITY (EXPLORATORY)
# ------------------------------------------------------------
AX_dysregulated_negative_affect:
  type: evaluative
  hypothesis_role: exploratory
  description: >
    Baseline negative emotional states (3.2). Distinct from couple conflict (4.4) and H5 composite.

  anchors:
    taxonomy:
      - 3.2

  radway_weights:
    I: 1.0
    II: 0.5
    III: 0.0

  construction:
    method: weighted_sum
    weights: equal

# ------------------------------------------------------------
# DARK VS TENDER (CONFIRMATORY) — H5
# ------------------------------------------------------------
AX_dark_vs_tender:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H5]
  description: >
    Darkness (distress, couple conflict, external crisis/violence) minus tenderness and care.

  construction:
    method: difference
    minuend:
      taxonomy:
        - 3.2
        - 4.4
        - 7.2
        - 7.3
    subtrahend:
      taxonomy:
        - 3.1
        - 2.2
        - 4.6

# ------------------------------------------------------------
# MISCOMMUNICATION (CONFIRMATORY) — RQ5 / Stage 11 drama obstacle
# ------------------------------------------------------------
AX_miscommunication:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H6]
  description: >
    Secrets, misunderstandings, and withheld information between the main couple.

  anchors:
    taxonomy:
      - 4.3

  construction:
    method: weighted_sum
    weights: equal

# ------------------------------------------------------------
# MISCOMMUNICATION BALANCE (EXPLORATORY)
# ------------------------------------------------------------
AX_miscommunication_balance:
  type: evaluative
  hypothesis_role: exploratory
  description: >
    Payoff/safety minus miscommunication — static book-level proxy for repair dominance.

  construction:
    method: difference
    minuend:
      ref: AX_payoff_safety
    subtrahend:
      ref: AX_miscommunication

# ------------------------------------------------------------
# PROTECTIVE CARE (CONFIRMATORY) — H4 positive leg
# ------------------------------------------------------------
AX_protective_care:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H4]
  description: >
    Non-coercive protective caretaking and reassurance (4.6).

  anchors:
    taxonomy:
      - 4.6

  construction:
    method: weighted_sum
    weights: equal

# ------------------------------------------------------------
# POSSESSIVENESS (CONFIRMATORY) — H4 negative leg
# ------------------------------------------------------------
AX_possessiveness:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H4]
  description: >
    Jealous and possessive relational conflict (4.7).

  anchors:
    taxonomy:
      - 4.7

  construction:
    method: weighted_sum
    weights: equal

# ------------------------------------------------------------
# PROTECTIVE VS POSSESSIVE (CONFIRMATORY) — H4
# ------------------------------------------------------------
AX_protective_vs_possessive:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H4]
  description: >
    Caring protection valued over jealousy/possessiveness.

  construction:
    method: difference
    minuend:
      ref: AX_protective_care
    subtrahend:
      ref: AX_possessiveness

# ------------------------------------------------------------
# STATUS / POWER (VISIBILITY — reach, not quality)
# ------------------------------------------------------------
AX_status_power:
  type: visibility
  hypothesis_role: confirmatory
  description: >
    Elite authority, material glamour, and aristocratic rank (6.1a + 6.6 + 6.7).
    Economic precarity (6.4) is excluded. Primary outcome: log_rating_count — not star quality.

  composite_ref: status_power

  construction:
    method: weighted_sum_from_composite

  usage:
    primary_outcome: log_rating_count

# ------------------------------------------------------------
# LUXURY COMPOSITE (VISIBILITY / H3)
# ------------------------------------------------------------
AX_luxury_composite:
  type: visibility
  hypothesis_role: confirmatory
  hypothesis: [H3]
  description: >
    Indirect luxury/status display: fashion, aristocracy, rituals, elite spaces, objects.

  composite_ref: luxury_composite

  construction:
    method: weighted_sum_from_composite

  usage:
    primary_outcome: log_rating_count

# ------------------------------------------------------------
# LUXURY × LOVE (H3 interaction)
# ------------------------------------------------------------
AX_luxury_x_love:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H3]
  description: >
    Wealth/glamour appeal paired with emotional depth (payoff/safety).

  construction:
    method: product
    factors:
      - AX_luxury_composite
      - AX_payoff_safety

# ------------------------------------------------------------
# VIOLENCE / COERCION (CONTROL)
# ------------------------------------------------------------
AX_violence_coercion:
  type: contextual
  hypothesis_role: descriptive
  description: >
    Physical violence, threats, and coercive control (7.2). Control variable only.

  anchors:
    taxonomy:
      - 7.2

  construction:
    method: weighted_sum
    weights: equal

  usage:
    allowed_as_predictor: false
    allowed_as_control: true

# ------------------------------------------------------------
# EXTERNAL CRISIS (CONTROL / H5 minuend component)
# ------------------------------------------------------------
AX_external_crisis:
  type: contextual
  hypothesis_role: descriptive
  description: >
    Accidents, crime, disasters, illness as external threats (7.3).

  anchors:
    taxonomy:
      - 7.3

  construction:
    method: weighted_sum
    weights: equal

  usage:
    allowed_as_predictor: false
    allowed_as_control: true

# ------------------------------------------------------------
# EVERYDAY INTIMACY & EMOTIONAL SAFETY (EXPLORATORY) — H1 / Goodreads
# ------------------------------------------------------------
AX_everyday_intimacy_emotional_safety:
  type: evaluative
  hypothesis_role: exploratory
  hypothesis: [H1]
  description: >
    Non-explicit relational closeness: ongoing courtship (4.2), reassurance/care (4.6),
    and non-explicit affection (2.2) as core only — no domestic/public setting low-weight mass.

  composite_ref: everyday_intimacy_emotional_safety

  construction:
    method: weighted_sum_from_composite

  excludes:
    taxonomy:
      - 2.3
      - 2.5
      - 4.7
      - 7.2
      - 7.4

# ------------------------------------------------------------
# SEXUAL TENSION & EXPLICIT INTIMACY (EXPLORATORY) — H1
# ------------------------------------------------------------
AX_sexual_tension_explicit_intimacy:
  type: evaluative
  hypothesis_role: exploratory
  hypothesis: [H1]
  description: >
    Desire, sexual tension, undressing/pre-sex escalation, explicit sexual acts,
    post-sex reflection, and sexual negotiation or safety preparation (2.1+2.3+2.4+2.5).
    Distinct from everyday courtship and non-explicit affection.

  composite_ref: sexual_tension_explicit_intimacy

  construction:
    method: weighted_sum_from_composite

  excludes:
    taxonomy:
      - 4.1
      - 4.2
      - 4.6
      - 7.4

# ------------------------------------------------------------
# COERCION RISK WATCHLIST (CONTEXTUAL)
# ------------------------------------------------------------
AX_coercion_risk_watchlist:
  type: contextual
  hypothesis_role: exploratory
  description: >
    Coercive or unwanted sexual contact (7.4) and non-sexual violence/threats (7.2).
    Possessive conflict (4.7) is optional low-weight context only. Descriptive watchlist
    requiring manual review — not a quality predictor.

  composite_ref: coercion_risk_watchlist

  construction:
    method: weighted_sum_from_composite

  usage:
    allowed_as_predictor: false
    allowed_as_control: true

# ------------------------------------------------------------
# ECONOMIC DEPENDENCY (EXPLORATORY) — separate from luxury/status
# ------------------------------------------------------------
AX_economic_dependency:
  type: evaluative
  hypothesis_role: exploratory
  description: >
    Financial precarity, housing insecurity, debt, and economic dependence (6.4).
    Separate from AX_luxury_composite and AX_status_power.

  composite_ref: economic_precarity_dependency

  construction:
    method: weighted_sum_from_composite

  usage:
    allowed_as_predictor: true

# ------------------------------------------------------------
# INTERNAL AMBIVALENCE (EXPLORATORY) — H5/H6 modifier, not confirmatory
# ------------------------------------------------------------
AX_internal_ambivalence:
  type: evaluative
  hypothesis_role: exploratory
  hypothesis: [H5, H6]
  description: >
    Love-hate ambivalence, mixed feelings, and internal conflict (3.3).
    Exploratory interpretive signal — not in axis_bearing_ids for confirmatory axes.

  anchors:
    taxonomy:
      - 3.3

  construction:
    method: weighted_sum
    weights: equal

# ------------------------------------------------------------
# NARRATIVE ARC REPAIR (CONFIRMATORY) — H6, segment-level only
# ------------------------------------------------------------
AX_narrative_arc_repair:
  type: evaluative
  hypothesis_role: confirmatory
  hypothesis: [H6]
  description: >
    Rising repair/payoff and falling miscommunication/negativity from begin to end.
    NOT a book-level static proportion — requires tertile segment topic mixtures.

  construction:
    method: tertile_delta
    level: segment
    segments: [begin, middle, end]
    rising:
      taxonomy:
        - 4.5
        - 3.1
        - 4.6
    falling:
      taxonomy:
        - 4.3
        - 4.4
        - 3.2

  usage:
    book_level: false
    segment_level: true

# Legacy alias (deprecated — use AX_violence_coercion)
AX_external_obstacle:
  deprecated: true
  alias_of: AX_violence_coercion
