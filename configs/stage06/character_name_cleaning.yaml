# Pre-Stage07 character name cleaning — spaCy NER only (no hardcoded name lists)

keep_role_tokens:
  - doctor
  - dr
  - sir
  - lady
  - lord
  - duke
  - duchess
  - captain
  - officer
  - detective

ratio_thresholds:
  character_name_cluster: 0.50
  name_contaminated_review: 0.20

person_placeholder: "[person]"

# Minimal sentence template for single-token NER probe on topic keywords.
ner_probe_template: "{token} walked into the room and looked around."
