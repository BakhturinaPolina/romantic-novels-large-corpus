# Stage03 train/eval BERTopic tuning configuration

embedding_models:
  - "sentence-transformers/all-MiniLM-L12-v2"
  - "sentence-transformers/paraphrase-mpnet-base-v2"
  - "sentence-transformers/paraphrase-MiniLM-L6-v2"

device: "auto"
embedding_batch_size: 256

# Optional Hub cache for large embedding .npy files (private dataset).
# Authenticate with: export HF_TOKEN="hf_..."  (never commit tokens to git)
embeddings_hub:
  enabled: true
  repo_id: "RuthonField/romance-v2-train-eval-embeddings"
  # Upload local .npy + manifest after encoding completes.
  upload_after_compute: false
  # Download from Hub when local .npy is missing (skips re-encoding).
  download_if_missing: true

text:
  sentence_column: "sentence"
  # Stream CSV rows in batches (avoids loading full train/val into RAM).
  csv_chunk_size: 50000
  # Cap eval sentences used for OCTIS coherence during tuning (None = all eval rows).
  coherence_eval_max_docs: 100000
  # Cap documents passed to GPU UMAP/HDBSCAN during BERTopic fit (full corpus ~100M rows).
  bertopic_fit_max_docs: 500000

optimization:
  number_of_calls: 120
  model_runs: 1
  save_models: false
  seed: 42
  default_stability_score: 0.0

search_space:
  umap__n_neighbors: [2, 50]
  umap__n_components: [2, 10]
  umap__min_dist: [0.0, 0.1]
  hdbscan__min_cluster_size: [50, 500]
  hdbscan__min_samples: [10, 100]
  vectorizer__min_df: [0.001, 0.01]
  bertopic__top_n_words: [10, 40]
  bertopic__min_topic_size: [10, 250]
