# Configuration for notebooks/04_selection/ v3 BO selection analysis
#
# Single-run mode: use top-level run_id / inputs / outputs (backward compatible).
# Multi-run compare: set `runs` + `comparison`; notebooks write per-run outputs
# and cross-model tables under comparison.base_dir.

run_id: v3_minilm12v2_first

comparison:
  id: l12_vs_l6
  base_dir: results/selection/_compare/l12_vs_l6

runs:
  - run_id: v3_minilm12v2_first
    label: L12
    embedding_model: sentence-transformers/all-MiniLM-L12-v2
    inputs:
      trials_partial_csv: results/experiments/v3_minilm12v2_first/opt_1_sentence-transformers__all-MiniLM-L12-v2/trials_partial.csv
      trials_summary_csv: results/experiments/v3_minilm12v2_first/trials.csv
      eval_select_top_k: results/selection/v3_minilm12v2_first/top_k.csv
      winner_config: results/selection/v3_minilm12v2_first/winner_config.json
    outputs:
      base_dir: results/selection/v3_minilm12v2_first/notebook_analysis
      figures_dir: results/selection/v3_minilm12v2_first/notebook_analysis/figures
      tables_dir: results/selection/v3_minilm12v2_first/notebook_analysis/tables
      top_models_dir: results/selection/v3_minilm12v2_first/notebook_analysis/top_models

  - run_id: v3_minilm6_first
    label: L6
    embedding_model: sentence-transformers/paraphrase-MiniLM-L6-v2
    inputs:
      trials_partial_csv: results/experiments/v3_minilm6_first/opt_1_sentence-transformers__paraphrase-MiniLM-L6-v2/trials_partial.csv
      trials_summary_csv: results/experiments/v3_minilm6_first/trials.csv
      eval_select_top_k: results/selection/v3_minilm6_first/top_k.csv
      winner_config: results/selection/v3_minilm6_first/winner_config.json
    outputs:
      base_dir: results/selection/v3_minilm6_first/notebook_analysis
      figures_dir: results/selection/v3_minilm6_first/notebook_analysis/figures
      tables_dir: results/selection/v3_minilm6_first/notebook_analysis/tables
      top_models_dir: results/selection/v3_minilm6_first/notebook_analysis/top_models

  - run_id: v4_l12_granular_phase3
    label: v4_L12_phase3
    embedding_model: sentence-transformers/all-MiniLM-L12-v2
    inputs:
      trials_partial_csv: results/experiments/v4_l12_granular_phase3/opt_1_sentence-transformers__all-MiniLM-L12-v2/trials_partial.csv
      trials_summary_csv: results/experiments/v4_l12_granular_phase3/trials.csv
      eval_select_top_k: results/selection/v4_l12_granular_phase3/top_k.csv
      winner_config: results/selection/v4_l12_granular_phase3/winner_config.json
    outputs:
      base_dir: results/selection/v4_l12_granular_phase3/notebook_analysis
      figures_dir: results/selection/v4_l12_granular_phase3/notebook_analysis/figures
      tables_dir: results/selection/v4_l12_granular_phase3/notebook_analysis/tables
      top_models_dir: results/selection/v4_l12_granular_phase3/notebook_analysis/top_models

  - run_id: v4_l6_granular_phase3
    label: v4_L6_phase3
    embedding_model: sentence-transformers/paraphrase-MiniLM-L6-v2
    inputs:
      trials_partial_csv: results/experiments/v4_l6_granular_phase3/opt_1_sentence-transformers__paraphrase-MiniLM-L6-v2/trials_partial.csv
      trials_summary_csv: results/experiments/v4_l6_granular_phase3/trials.csv
      eval_select_top_k: results/selection/v4_l6_granular_phase3/top_k.csv
      winner_config: results/selection/v4_l6_granular_phase3/winner_config.json
    outputs:
      base_dir: results/selection/v4_l6_granular_phase3/notebook_analysis
      figures_dir: results/selection/v4_l6_granular_phase3/notebook_analysis/figures
      tables_dir: results/selection/v4_l6_granular_phase3/notebook_analysis/tables
      top_models_dir: results/selection/v4_l6_granular_phase3/notebook_analysis/top_models

  - run_id: v4_mpnet_granular_phase3
    label: v4_MPNet_phase3
    embedding_model: sentence-transformers/paraphrase-mpnet-base-v2
    inputs:
      trials_partial_csv: results/experiments/v4_mpnet_granular_phase3/opt_1_sentence-transformers__paraphrase-mpnet-base-v2/trials_partial.csv
      trials_summary_csv: results/experiments/v4_mpnet_granular_phase3/trials.csv
      eval_select_top_k: results/selection/v4_mpnet_granular_phase3/top_k.csv
      winner_config: results/selection/v4_mpnet_granular_phase3/winner_config.json
    outputs:
      base_dir: results/selection/v4_mpnet_granular_phase3/notebook_analysis
      figures_dir: results/selection/v4_mpnet_granular_phase3/notebook_analysis/figures
      tables_dir: results/selection/v4_mpnet_granular_phase3/notebook_analysis/tables
      top_models_dir: results/selection/v4_mpnet_granular_phase3/notebook_analysis/top_models

# Legacy single-run paths (primary run; used by stage05 pareto CLI)
inputs:
  trials_partial_csv: results/experiments/v3_minilm12v2_first/opt_1_sentence-transformers__all-MiniLM-L12-v2/trials_partial.csv
  trials_summary_csv: results/experiments/v3_minilm12v2_first/trials.csv
  eval_select_top_k: results/selection/v3_minilm12v2_first/top_k.csv
  winner_config: results/selection/v3_minilm12v2_first/winner_config.json

outputs:
  base_dir: results/selection/v3_minilm12v2_first/notebook_analysis
  figures_dir: results/selection/v3_minilm12v2_first/notebook_analysis/figures
  tables_dir: results/selection/v3_minilm12v2_first/notebook_analysis/tables
  top_models_dir: results/selection/v3_minilm12v2_first/notebook_analysis/top_models

legacy_cleaning:
  remove_failed_runs: true
  outlier_std_dev: 2.0
  prefilter_min_n_topics: 1

legacy_normalization:
  method: zscore

weighting_strategies:
  equal_weights:
    weight_coherence: 0.5
    weight_topic_diversity: 0.5
  coherence_priority:
    weight_coherence: 0.7
    weight_topic_diversity: 0.3

pareto:
  metrics:
    - Coherence_norm
    - Topic_Diversity_norm
  analyze_per_model: true

selection:
  top_k: 10

hyperparameters:
  - bertopic__top_n_words
  - hdbscan__min_cluster_size
  - hdbscan__min_samples
  - hdbscan__cluster_selection_method
  - umap__min_dist
  - umap__n_components
  - umap__n_neighbors
  - vectorizer__min_df

performance_metrics_legacy:
  - Coherence_norm
  - Topic_Diversity_norm
  - Combined_Score

performance_metrics_v3:
  - coherence_c_v
  - topic_diversity
  - n_topics
  - bo_objective
  - weighted_score
  - outlier_rate
  - largest_topic_share
  - median_topic_size

eval_select_config: configs/eval_select.yaml
eval_select_config_granular: configs/eval_select_granular.yaml

plotting:
  style: whitegrid
  figure_dpi: 100
